# One rule governs every step in this file: the step's exit code is the verdict.
#
# No test command is piped into `tee`, a formatter, or a summariser; no step
# carries `continue-on-error`; no run of vitest passes `--reporter=json`.
# Vitest reports an unhandled rejection as `Errors 1 error` while printing every
# test as passed, and exits 1 — and its JSON reporter does not carry those
# errors at all. Reading the pass count instead of the exit status is what let
# four core PRs merge broken. If you need more output from a failing job, make
# the command itself louder; do not wrap it.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Nothing here writes to the repository; the cross-repository checkouts read
# public repositories only.
permissions:
  contents: read

jobs:
  backend:
    # This addon runs in the core process: Dockerfile.test COPYs backend/app/
    # and the addon imports core's models and services directly. So its image
    # cannot be built from this checkout alone — it needs a core tree with this
    # commit sitting at addons/media_import.
    #
    # The mirror image of this job also runs in core's own CI, because a change
    # to core's app package is the other way this pairing breaks.
    name: backend (pytest against a core tree)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: addon

      # No submodules: the test image copies backend/ and this addon, nothing
      # else under addons/.
      - uses: actions/checkout@v4
        with:
          repository: mamepenguin/Litloft
          ref: develop
          path: core

      # No pipe here on purpose. A `run:` step's default shell on Linux is
      # `bash -e {0}` — `pipefail` is only added when `shell: bash` is set
      # explicitly — so `producer | consumer` reports only the consumer's
      # status, and a half-copied tree would sail through as success.
      - name: Stand this commit in for the pinned submodule
        shell: bash
        run: |
          set -euo pipefail
          rm -rf core/addons/media_import
          mkdir -p core/addons/media_import
          cp -a addon/. core/addons/media_import/
          rm -rf core/addons/media_import/.git

      # Context is the core repository root: the addon and the core `app`
      # package it imports have to land in one tree.
      - name: Build the test image
        run: docker build -f addons/media_import/Dockerfile.test -t media-import-test .
        working-directory: core

      # `pytest.ini` turns measurement on and `.coveragerc` fixes what is
      # measured; the floor is added only here, because a floor is a claim
      # about a complete run and `addopts` reaches partial ones too.
      #
      # `PYTEST_ADDOPTS` rather than a command after the image name:
      # `docker run --rm media-import-test --cov-fail-under=80.50` *replaces*
      # the CMD and the container never starts, and respelling the whole
      # pytest command here would let it drift from the CMD. This appends.
      #
      # 80.50 is the measured total truncated, over the population WITHOUT
      # this addon's own tests — it was 93% while they were counted. Bracket
      # the exit code when this number moves, not the printed message: those
      # two are computed differently and disagree wherever a total rounds up.
      # The floor travels in `PYTEST_ADDOPTS` because it appends to the image's
      # CMD (a command after the image name *replaces* the CMD and the
      # container never starts). But a misspelled variable name is silent: the
      # suite passes, nothing is gated, and the log looks normal.
      #
      # So the same variable also carries `--cov-report=json`. If it does not
      # take effect, the report is not written either, and the step below fails
      # on the missing file instead of succeeding for the wrong reason.
      - name: Test
        shell: bash
        env:
          COV_FLOOR: "80.50"
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cov"
          docker run --rm -v "$RUNNER_TEMP/cov:/out" \
            -e PYTEST_ADDOPTS="--cov-fail-under=$COV_FLOOR --cov-report=json:/out/cov.json" \
            media-import-test

      # The floor is a lower bound, and a lower bound cannot see the
      # denominator shrink — the percentage goes *up*. This addon's tests live
      # inside the measured package, so `.coveragerc`'s `omit` is the only
      # thing keeping them out, and breaking its prefix is silent: measured,
      # the total becomes 91.46% and the gate stays green.
      #
      # So the population is compared too, as a set, against an independent
      # walk of this checkout. Filtering the report for test paths — what this
      # step did before — reads the observation twice and so holds only that
      # one direction; `scripts/check-coverage-population.py` says what the
      # other direction is and what it measured.
      - name: Verify the floor was applied, over the right population
        shell: bash
        env:
          COV_FLOOR: "80.50"
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/cov/cov.json"
          python3 addon/scripts/check-coverage-population.py "$report" "$COV_FLOOR"

  frontend:
    # This addon's frontend has no runner of its own. Its components import
    # core's (@/components, @/hooks, @/lib) and its tests are collected by
    # core's vitest through `frontend/src/addons/<name>/`, which
    # `setup-addons.sh` builds as a real directory holding one symlink per
    # file. So the only way to test it is to assemble a core checkout with this
    # commit standing in for the pinned submodule, and run core's suite.
    #
    # Core's default branch is what this commit is about to be pinned into, so
    # that is what it is tested against. A core-side break turning this job red
    # is the pairing being reported, not noise.
    #
    # The consequence to know before it bites: `develop` is resolved to its tip
    # at run time, not to a fixed SHA, so this job's result is not reproducible.
    # A pull request that changes nothing here can go red later because core
    # moved. If a branch you have not touched fails in a core file, re-run the
    # job — if core has since merged the fix, that is all it needs.
    name: frontend (core vitest / tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: addon

      - uses: actions/checkout@v4
        with:
          repository: mamepenguin/Litloft
          ref: develop
          submodules: recursive
          path: core

      # The other three addons stay at the commits core pins; only this one is
      # replaced, and .git is dropped so the tree is a plain directory.
      #
      # No pipe here on purpose. A `run:` step's default shell on Linux is
      # `bash -e {0}` — `pipefail` is only added when `shell: bash` is set
      # explicitly — so `producer | consumer` reports only the consumer's
      # status, and a half-copied tree would sail through as success.
      - name: Stand this commit in for the pinned submodule
        shell: bash
        run: |
          set -euo pipefail
          rm -rf core/addons/media_import
          mkdir -p core/addons/media_import
          cp -a addon/. core/addons/media_import/
          rm -rf core/addons/media_import/.git

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: core/frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: core/frontend/pnpm-lock.yaml

      # Builds the gitignored `frontend/src/addons/<name>/`: a real directory
      # holding one symlink per file, rather than a symlink to the addon's
      # `frontend/`, because a tool that walks a tree descends the first and
      # not the second. Without it vitest collects no addon test and the suite
      # is green for the wrong reason.
      - name: Link addons into backend/ and frontend/
        run: ./setup-addons.sh
        working-directory: core

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: core/frontend

      - name: Merge addon translations
        run: node scripts/merge-addon-messages.mjs
        working-directory: core/frontend

      # A tree that failed to land costs nothing at collection time: vitest
      # finds fewer files and reports every one of them passing. Ask the
      # collector what it found rather than assuming this addon is in it.
      - name: Fail if this addon's tests were not collected
        shell: bash
        working-directory: core/frontend
        run: |
          set -euo pipefail
          collected="$(pnpm exec vitest list --filesOnly)"
          printf '%s\n' "$collected" | grep -q '^src/addons/media_import/' || {
            echo "::error::vitest collected no tests from addons/media_import"
            exit 1
          }

      - name: Test
        run: pnpm test
        working-directory: core/frontend

      # tsc reads this addon's sources through `frontend/src/addons/<name>`
      # and type-checks them against core's.
      #
      # eslint is not run here, and the reason is not that it cannot see these
      # files: core's `frontend/eslint.config.mjs` ignores `src/addons/**`, so
      # running it would lint core and say nothing about this addon. Nothing
      # lints these files anywhere — this repository has no eslint config and
      # no package.json — which makes tsc the whole of the static checking
      # they get. (It used to be true that eslint could not reach them, when
      # core linked each addon in as one directory symlink and eslint would
      # not descend it. Core now builds that directory for real, so the
      # exclusion is a declaration rather than an accident.)
      - name: Type-check
        run: pnpm exec tsc --noEmit
        working-directory: core/frontend
