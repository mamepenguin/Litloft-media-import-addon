[pytest]
testpaths = addons/media_import/tests
pythonpath = .

# Coverage is measured on every run, including a partial one — `pytest -k x`
# measured nothing at all before this. `--cov-branch` because a line that ran
# is not a branch that was taken; it lowers the reported total because it
# counts something line coverage does not.
#
# The population it measures is corrected by `.coveragerc`, which omits this
# addon's own tests. They sit inside the measured package, and counting them
# put 62% of the denominator on files that cannot fail to be covered. Read
# that file before moving the floor.
#
# The floor is deliberately NOT here. `--cov-fail-under` in `addopts` fails
# every partial run — `pytest addons/media_import/tests/test_watch_surface.py`
# exits 1 on a passing test, including the single-file reproductions a
# reviewer is asked to run. A floor is a claim about a COMPLETE run, so it
# lives where completeness is known: the CI step, as `PYTEST_ADDOPTS`.
#
# `--cov-precision=2` widens the comparison from whole percents to two
# decimals. coverage.py prints its pass/fail message from the raw total and
# computes its exit code from the ROUNDED one, so the two disagree wherever a
# total rounds up — a floor at a rounded value can print `FAIL` and exit 0.
# The floor in CI is therefore the measured total truncated, and it was
# bracketed against the exit code rather than read off the message.
#
# This makes `pytest-cov` a hard requirement of anything that loads this ini:
# without it pytest fails to start, rather than running unmeasured. It comes
# from core's `backend/requirements-dev.txt`, which `Dockerfile.test`
# installs.
#
# `pytest --no-cov -k something` turns measurement off for a tight loop. It is
# a speed switch and nothing depends on it: with the floor out of `addopts`, a
# partial run is green whether or not you pass it.
#
# `# pragma: no cover` raises this number by taking statements out of the
# denominator. There are 7 in this package, holding back 16 statements and no
# branches, all 16 of them uncovered. Measured at 79.957537% without them
# against 80.504489% with: +0.547 points. `--cov-fail-under=80.50` refuses
# below 80.495, so the fall this gate will tolerate from today's total is
# 0.009489 points — the seven annotations are worth fifty-seven times that whole
# resolution, and one of them averages eight times it. They move the number the
# wrong way; count them before moving the floor.
#
# When re-measuring, keep `.coveragerc`'s `omit` and neutralise ONLY the pragma
# pattern. `exclude_lines` defaults to THREE regexes — the pragma one, `...`
# stub bodies, and `if TYPE_CHECKING:` — so overriding the option wholesale
# re-includes the other two and overstates the annotations: measured, that route
# reports 22 statements and 0.75 points for the same seven pragmas.
addopts = --cov=addons.media_import --cov-branch --cov-precision=2 --cov-report=term-missing
